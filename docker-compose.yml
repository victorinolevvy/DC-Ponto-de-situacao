services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ponto_dev
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: node:20
    restart: unless-stopped
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ponto_dev?schema=public
      JWT_SECRET: supersecretkey
      JWT_EXPIRES_IN: 3600s
      RELATORIOS_TOLERANCIA_FUTURO_DIAS: 3
      CORS_ORIGIN: http://localhost:5173
      THROTTLE_TTL_MS: 60000
      THROTTLE_LIMIT: 100
    command: >-
      sh -c "npm install && npm run prisma:generate && npm run prisma:migrate:deploy && npm run seed:dev && npm run start:dev"
    ports:
      - '3000:3000'
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

  adminer:
    image: adminer:4
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '8080:8080'

volumes:
  postgres_data:
  backend_node_modules:
